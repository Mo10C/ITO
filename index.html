<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>itoルーム</title>
<!--
  ============================================================
  itoルーム — みんなで1つの部屋で遊ぶ ito風 協力ゲーム
  ・単一HTML / React (Babel standalone) / Firestore リアルタイム同期
  ・常設1部屋方式: URLを開いて名前を入れるだけで参加
  ・お題は「各プレイヤーの候補からルーレット」または「ホストが手入力」

  ▼セットアップ手順
  1. Firebaseコンソールで(既存プロジェクトでOK) Firestore を有効化
  2. 下の firebaseConfig に自分のプロジェクトの設定を貼り付け
  3. Firestoreルール(お試し用)例:
       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /ito/{doc} {
             allow read, write: if true;
           }
         }
       }
  4. GitHub Pages にこのファイルを置くだけで動作

  ※数字はFirestoreの共有ドキュメントに載るため、開発者ツールを
    覗けば見えます(身内で遊ぶカジュアル用途を想定)。
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF6F3;
    --ink:#17312E;
    --panel:#FFFFFF;
    --teal:#23B5A3;
    --teal-dk:#128778;
    --pink:#FF5D8A;
    --yellow:#FFCF4D;
    --red:#E5484D;
    --muted:#6B8783;
    --bd:2.5px solid var(--ink);
    --sh:4px 4px 0 rgba(23,49,46,.85);
    --rad:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'M PLUS Rounded 1c', system-ui, sans-serif;
    background:var(--bg);
    background-image:radial-gradient(rgba(35,181,163,.14) 1.5px, transparent 1.5px);
    background-size:22px 22px;
    color:var(--ink);
    min-height:100vh;
  }
  #root{max-width:none; margin:0; padding:0;}

  .logo{display:flex; align-items:baseline; gap:8px; margin:6px 0 14px;}
  .logo h1{font-size:30px; font-weight:800; margin:0; letter-spacing:.02em;}
  .logo h1 .dot{color:var(--teal);}
  .logo .sub{font-size:12px; color:var(--muted); font-weight:700;}

  .panel{background:var(--panel); border:var(--bd); border-radius:var(--rad);
    box-shadow:var(--sh); padding:14px; margin-bottom:14px;}

  .btn{font-family:inherit; font-weight:800; font-size:15px; cursor:pointer;
    border:var(--bd); border-radius:12px; padding:10px 16px;
    background:var(--teal); color:#fff; box-shadow:3px 3px 0 rgba(23,49,46,.85);
    transition:transform .06s;}
  .btn:active{transform:translate(3px,3px); box-shadow:none;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.pink{background:var(--pink);}
  .btn.ghost{background:#fff; color:var(--ink);}
  .btn.warn{background:var(--red);}
  .btn.sm{font-size:12px; padding:6px 10px; border-radius:9px; border-width:2px; box-shadow:2px 2px 0 rgba(23,49,46,.85);}
  .btn.big{font-size:19px; padding:14px 20px; width:100%;}
  a.btn{text-decoration:none; display:inline-block; white-space:nowrap;}

  input[type=text], select{
    font-family:inherit; font-size:16px; font-weight:700;
    border:var(--bd); border-radius:12px; padding:10px 12px; width:100%;
    background:#fff; color:var(--ink); outline:none;
  }
  input[type=text]:focus, select:focus{box-shadow:0 0 0 3px rgba(35,181,163,.35);}
  select{width:auto;}

  .label{font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.12em; margin-bottom:5px;}

  /* ヘッダー: ラウンド & ライフ */
  .status{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .round-chip{background:var(--ink); color:#fff; font-weight:800; font-size:13px;
    padding:5px 12px; border-radius:999px;}
  .round-chip.miss{background:var(--red);}
  .rank{flex:0 0 22px; height:22px; border-radius:50%; background:var(--teal); color:#fff;
    font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;}

  /* お題カード */
  .theme-card{background:var(--yellow); text-align:center; padding:16px 14px;}
  .theme-card .label{color:rgba(23,49,46,.6);}
  .theme-card .txt{font-size:21px; font-weight:800; line-height:1.35;}

  /* 自分の数字カード */
  .mycard-wrap{display:flex; gap:12px; align-items:stretch;}
  .mycard{flex:0 0 118px; height:150px; border:var(--bd); border-radius:var(--rad);
    box-shadow:var(--sh); display:flex; flex-direction:column; align-items:center;
    justify-content:center; cursor:pointer; user-select:none; position:relative; overflow:hidden;}
  .mycard.hidden-face{background:repeating-linear-gradient(45deg, var(--teal), var(--teal) 9px, var(--teal-dk) 9px, var(--teal-dk) 18px); color:#fff;}
  .mycard.open-face{background:#fff;}
  .mycard .num{font-size:52px; font-weight:800; line-height:1;}
  .mycard .hint{font-size:11px; font-weight:800; margin-top:6px; opacity:.85;}
  .mycard.played-face{background:#E8F0EE; color:var(--muted);}
  .my-side{flex:1; display:flex; flex-direction:column; gap:8px; justify-content:center;}

  /* 出されたカード(小さい順の列) */
  .cardrow{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; padding:4px 2px;}
  .pcard{width:58px; border:2.5px solid var(--ink); border-radius:10px; background:#fff;
    box-shadow:2px 2px 0 rgba(23,49,46,.85); text-align:center; padding:7px 2px 5px;}
  .pcard .n{font-size:21px; font-weight:800; line-height:1;}
  .pcard .who{font-size:9px; font-weight:700; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; padding:0 2px;}
  .pcard.ng{background:#FFE1E3; border-color:var(--red); color:var(--red);}
  .pcard.ng .who{color:var(--red);}
  .cardrow-empty{font-size:12px; font-weight:700; color:var(--muted); padding:10px 4px; text-align:center;}

  /* プレイヤーリスト */
  .plist{display:flex; flex-direction:column; gap:8px;}
  .prow{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; border:2px solid rgba(23,49,46,.18);
    border-radius:12px; padding:8px 10px; background:#FBFDFC;}
  .prow.me{border-color:var(--teal); background:#EFFAF7;}
  .prow .nm{font-weight:800; font-size:14px;}
  .prow .host-mark, .mrow .host-mark{font-size:10px; font-weight:800; background:var(--yellow);
    border:2px solid var(--ink); border-radius:6px; padding:1px 6px;}
  .wordline{flex-basis:100%; font-size:14px; font-weight:700; color:var(--ink);
    background:#FFF6DC; border:2px solid rgba(23,49,46,.15); border-radius:10px;
    padding:6px 10px; margin-top:2px; line-height:1.45; word-break:break-word;}
  .wordline .q{color:var(--teal-dk); font-weight:800; margin-right:4px;}
  .prow .st{font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px;}
  .st.wait{background:#E3EEEB; color:var(--muted);}
  .st.done{background:var(--ink); color:#fff;}
  .st.ng{background:var(--red); color:#fff;}
  .st.nonum{background:#fff; color:var(--muted); border:1.5px dashed var(--muted);}
  .st.bot{background:#EEE8FF; color:#5B3FB0;}
  .round-chip{white-space:nowrap;}
  .round-chip.anon{background:#5B3FB0;}
  .anon-tag{display:inline-block; background:#5B3FB0; color:#fff; border-radius:999px; padding:0 9px; margin-left:8px; font-size:11px;}
  .next-host .anon-toggle{padding:5px 10px;}
  .next-host .anon-toggle .at-label{font-size:13px;}
  .you-mark{font-size:11px; font-weight:800; background:var(--teal); color:#fff; border-radius:6px; padding:1px 7px;}
  .anon-toggle{font-family:inherit; display:flex; align-items:center; gap:10px; width:100%; cursor:pointer;
    border:2px solid rgba(23,49,46,.25); border-radius:12px; background:#FBFDFC; padding:8px 12px; color:var(--ink);}
  .anon-toggle .at-label{flex:1; text-align:left; font-size:14px; font-weight:800;}
  .anon-toggle .at-switch{flex:0 0 46px; height:26px; border-radius:999px; background:#C9D6D3;
    border:2px solid var(--ink); position:relative; transition:background .15s;}
  .anon-toggle .at-knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:#fff; border:2px solid var(--ink); transition:left .15s;}
  .anon-toggle .at-state{flex:0 0 30px; font-size:12px; font-weight:800; color:var(--muted);}
  .anon-toggle.on{border-color:#5B3FB0; background:#F1ECFF;}
  .anon-toggle.on .at-switch{background:#7C5CE0;}
  .anon-toggle.on .at-knob{left:22px;}
  .anon-toggle.on .at-state{color:#5B3FB0;}
  .st.prop{background:#FFF6DC; color:#8A6A00; border:1.5px solid rgba(138,106,0,.3);}

  /* 結果バナー */
  .result{padding:18px 14px; text-align:center;}
  .result.clear{background:#DFF7EF;}
  .result.fail{background:#FFE8EA;}
  .result .big-txt{font-size:30px; font-weight:800;}
  .result.clear .big-txt{color:var(--teal-dk);}
  .result.fail .big-txt{color:var(--red);}
  .result .desc{font-size:13px; font-weight:700; color:var(--muted); margin-top:4px;}

  .row{display:flex; gap:8px; align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .sp{flex:1;}
  .hr{border:none; border-top:2px dashed rgba(23,49,46,.2); margin:12px 0;}
  .note{font-size:11.5px; font-weight:700; color:var(--muted); line-height:1.6;}
  .foot{text-align:center; font-size:11px; font-weight:700; color:var(--muted); margin-top:18px;}

  /* お題候補 */
  .prop-row{display:flex; align-items:flex-start; gap:8px; border:2px solid rgba(23,49,46,.18);
    border-radius:12px; padding:8px 10px; background:#FBFDFC;}
  .prop-row.me{border-color:var(--teal); background:#EFFAF7;}
  .prop-row .ptxt{flex:1; font-size:14px; font-weight:800; line-height:1.4; word-break:break-word;}
  .prop-row .pby{font-size:10.5px; font-weight:700; color:var(--muted);}
  .prop-row.sel{align-items:center; padding:12px 12px;}
  .prop-row.sel .ptxt{font-size:18px;}
  .prop-row.sel .pby{font-size:11.5px;}

  /* お題ルーレット */
  .rl-window{background:var(--yellow); border:var(--bd); border-radius:14px; padding:22px 14px;
    min-height:180px; text-align:center; display:flex; flex-direction:column; justify-content:center; overflow:hidden;}
  .rl-window.hit{background:var(--pink); color:#fff;}
  .rl-txt{font-size:28px; font-weight:800; line-height:1.35; word-break:break-word;}
  .rl-by{font-size:12px; font-weight:800; color:rgba(23,49,46,.6); margin-top:6px;}
  .rl-window.hit .rl-by{color:rgba(255,255,255,.9);}
  .theme-card .by{font-size:11px; font-weight:800; color:rgba(23,49,46,.6); margin-top:4px;}

  /* ===== 全画面共通(PC・スクロールなし) ===== */
  .screen{height:100vh; height:100dvh; max-width:1600px; margin:0 auto; padding:14px 18px 18px;
    display:flex; flex-direction:column; gap:14px; overflow:hidden;}
  .screen .panel{margin:0;}
  .center-screen{align-items:center; justify-content:center;}
  .topbar{display:flex; align-items:center; gap:10px; flex:0 0 auto; min-height:48px;}
  .topbar .logo{margin:0 8px 0 0;}
  .topbar-title{font-size:15px; font-weight:800; color:var(--ink); margin-left:6px;}
  .logo.lg{flex-direction:column; align-items:flex-start; gap:6px; margin:0;}
  .logo.lg h1{font-size:72px; line-height:1;}
  .logo.lg .sub{font-size:16px;}
  .big-form input[type=text]{font-size:19px; padding:13px 15px;}
  .side-ctrl{display:flex; flex-direction:column; gap:10px; min-height:0;}
  .watch-msg{font-size:18px; font-weight:800; text-align:center; line-height:1.6;
    padding:24px 10px; color:var(--ink);}

  /* スタート画面 */
  .join-grid{flex:1; min-height:0; width:100%; max-width:1120px; margin:0 auto; display:grid;
    grid-template-columns:1.1fr .9fr; gap:48px; align-items:center;}

  /* あそびかた */
  .howto{display:flex; flex-direction:column; gap:12px;}
  .howto .step{display:flex; gap:12px; align-items:flex-start;}
  .howto .sn{flex:0 0 30px; height:30px; border-radius:50%; background:var(--ink); color:#fff;
    font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center;}
  .howto .st-t{font-size:15px; font-weight:800;}
  .howto .st-d{font-size:12.5px; font-weight:700; color:var(--muted); line-height:1.55;}

  /* メインメニュー / お題一覧 */
  .grid-lobby{flex:1; min-height:0; display:grid; gap:16px;
    grid-template-columns:minmax(260px, 27%) minmax(0, 1fr) minmax(300px, 31%);}
  .grid-select{flex:1; min-height:0; display:grid; gap:16px;
    grid-template-columns:minmax(0, 1fr) minmax(280px, 26%);}
  .tiles{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; align-content:start;}
  .tile{border:var(--bd); border-radius:14px; background:#fff; box-shadow:3px 3px 0 rgba(23,49,46,.85);
    padding:16px; display:flex; flex-direction:column; gap:6px; min-height:120px;}
  .tile-txt{font-size:23px; font-weight:800; line-height:1.3; word-break:break-word; flex:1;}
  .tile-by{font-size:12px; font-weight:800; color:var(--muted);}
  .tile .btn{align-self:flex-end;}
  .roulette-btn{font-size:22px; padding:26px 16px; line-height:1.4;}
  .tile{transition:background .08s, color .08s, opacity .3s, transform .08s;}
  .tile.on{background:var(--ink); color:#fff; transform:translateY(-3px);}
  .tile.on .tile-by{color:rgba(255,255,255,.75);}
  .tile.win{background:var(--pink); color:#fff; transform:translateY(-3px); box-shadow:5px 5px 0 rgba(23,49,46,.85);}
  .tile.win .tile-by{color:rgba(255,255,255,.9);}
  .tile.dim{opacity:.35;}

  /* 結果画面 */
  .arow{display:flex; align-items:center; gap:14px; border:2.5px solid var(--ink); border-radius:12px;
    background:#fff; box-shadow:2px 2px 0 rgba(23,49,46,.85); padding:8px 14px;}
  .arow .anum{flex:0 0 60px; font-size:34px; font-weight:800; text-align:center; line-height:1; color:var(--teal-dk);}
  .arow.ng{background:#FFE1E3; border-color:var(--red);}
  .arow.ng .anum, .arow.ng .mname{color:var(--red);}
  .trow{display:flex; align-items:center; gap:10px; border:2px solid rgba(23,49,46,.18);
    border-radius:10px; padding:8px 12px; background:#FBFDFC; font-weight:800;}
  .trow .ti{flex:0 0 24px; height:24px; border-radius:50%; background:var(--ink); color:#fff;
    font-size:12px; display:flex; align-items:center; justify-content:center;}
  .trow .tn{font-size:14px;}
  .trow .tv{font-size:20px;}
  .trow.ng{border-color:var(--red); background:#FFE1E3; color:var(--red);}
  .trow.ng .ti{background:var(--red);}
  .pcol > .result{flex:0 0 auto; padding:14px 12px;}
  .pcol > .result .big-txt{font-size:26px;}
  .next-host .label{margin-bottom:0;}
  .pcol{overflow-y:auto;}

  /* ===== プレイ中画面(3カラム) ===== */
  .play-top{display:flex; align-items:center; gap:14px; flex:0 0 auto;}
  .play-side{flex:1 1 0; display:flex; gap:8px; align-items:center; min-width:0;}
  .play-side.right{justify-content:flex-end;}
  .play-theme{flex:0 1 860px; background:var(--yellow); border:var(--bd); border-radius:var(--rad);
    box-shadow:var(--sh); text-align:center; padding:10px 18px;}
  .play-theme .label{color:rgba(23,49,46,.6); margin-bottom:2px;}
  .play-theme .txt{font-size:30px; font-weight:800; line-height:1.25; word-break:break-word;}
  .play-theme .by{font-size:12px; font-weight:800; color:rgba(23,49,46,.6); margin-top:3px;}
  .grid3{flex:1; min-height:0; display:grid; gap:16px;
    grid-template-columns:minmax(250px, 22%) minmax(0, 1fr) minmax(270px, 27%);}
  .pcol{display:flex; flex-direction:column; gap:16px; min-height:0;}
  .pcol-panel{display:flex; flex-direction:column; min-height:0;}
  .pscroll{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
    padding:2px 6px 6px 2px;}

  .pc-me{flex:1; display:flex; flex-direction:column; gap:12px; min-height:0;}
  .pc-me .label{margin-bottom:0;}
  .pc-card{flex:1 1 auto; min-height:120px; max-height:300px; border:var(--bd); border-radius:16px;
    box-shadow:var(--sh); background:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center;}
  .pc-card .num{font-size:96px; font-weight:800; line-height:1; color:var(--teal-dk);}
  .pc-card .hint{font-size:13px; font-weight:800; margin-top:8px; color:var(--muted);}
  .pc-card.played{background:#E8F0EE;}
  .pc-card.played .num{color:var(--muted);}
  .pc-card.ng{background:#FFE1E3; border-color:var(--red);}
  .pc-card.ng .num, .pc-card.ng .hint{color:var(--red);}
  .pc-card.watch{font-size:20px; font-weight:800; color:var(--muted);}
  .pc-ctrl{display:flex; flex-direction:column; gap:8px; align-items:flex-start; flex:0 0 auto;}

  .mrow{display:flex; align-items:center; gap:12px; border:2px solid rgba(23,49,46,.18);
    border-radius:12px; padding:9px 12px; background:#FBFDFC;
    cursor:grab; user-select:none; -webkit-user-select:none; position:relative;}
  .mrow.me{border-color:var(--teal); background:#EFFAF7;}
  .mrow.shifting{transition:transform .15s ease;}
  .mrow.dragging{z-index:5; cursor:grabbing; border-color:var(--ink);
    box-shadow:6px 8px 0 rgba(23,49,46,.35); background:#fff;}
  .mrow .grip{flex:0 0 auto; font-size:20px; line-height:1; color:rgba(23,49,46,.35);
    touch-action:none; cursor:grab; padding:4px 0;}
  .mrow.dragging .grip{color:var(--ink);}
  .mrow .rank{flex:0 0 28px; height:28px; font-size:14px;}
  .mbody{flex:1; min-width:0;}
  .mname{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:800; color:var(--muted);}
  .mword{font-size:21px; font-weight:800; line-height:1.3; word-break:break-word; margin-top:1px;}
  .mword.empty{font-size:14px; color:var(--muted); font-weight:700;}
  .mbtns{display:flex; gap:6px; align-items:center; flex:0 0 auto;}

  .brow{display:flex; align-items:center; gap:12px; border:2.5px solid var(--ink); border-radius:12px;
    background:#fff; box-shadow:2px 2px 0 rgba(23,49,46,.85); padding:7px 12px;}
  .brow .bnum{flex:0 0 52px; font-size:30px; font-weight:800; text-align:center; line-height:1;}
  .brow .bbody{flex:1; min-width:0;}
  .brow .bword{font-size:19px; font-weight:800; line-height:1.3; word-break:break-word;}
  .brow .bword.empty{font-size:13px; font-weight:700; color:var(--muted);}
  .brow .bname{font-size:11.5px; font-weight:700; color:var(--muted); margin-top:2px;}
  .brow.ng{background:#FFE1E3; border-color:var(--red); color:var(--red);}
  .brow.ng .bword, .brow.ng .bname{color:var(--red);}

  /* 狭い画面では縦に並べてスクロール可 */
  @media (max-width: 900px){
    .screen{height:auto; overflow:visible; padding:12px;}
    .topbar{flex-wrap:wrap;}
    .play-top{flex-wrap:wrap;}
    .play-theme{flex:1 1 100%; order:3;}
    .grid3, .grid-lobby, .grid-select, .join-grid{grid-template-columns:1fr; gap:14px;}
    .logo.lg h1{font-size:52px;}
    .pc-card{flex:0 0 auto; height:150px;}
    .pscroll, .pcol{overflow:visible;}
  }

  .cfg-err{border-color:var(--red);}
  .cfg-err code{background:#FFE8EA; border-radius:6px; padding:1px 6px; font-size:12px;}

  @media (prefers-reduced-motion: no-preference){
    .pcard, .brow{animation:drop .3s ease-out;}
    @keyframes drop{from{transform:translateY(-12px); opacity:0;}
      to{transform:translateY(0); opacity:1;}}
    .rl-tick{animation:rlTick .12s ease-out;}
    @keyframes rlTick{from{transform:translateY(-35%); opacity:.25;} to{transform:none; opacity:1;}}
    .rl-window.hit{animation:rlHit .5s ease-out;}
    @keyframes rlHit{0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);}}
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-presets="react">

const CONFIG_OK = !!(firebaseConfig.apiKey && firebaseConfig.projectId);

/* 部屋の合言葉 → FirestoreドキュメントID */
function normalizeRoomId(s) {
  let id = (s || "").trim().replace(/[\/\s]+/g, "-").slice(0, 20);
  if (id === "." || id === "..") id = "room-" + id.length;
  return id;
}
const initialRoom = (() => {
  try {
    const h = decodeURIComponent((location.hash || "").slice(1));
    if (h) return normalizeRoomId(h);
    return sessionStorage.getItem("ito_room") || "";
  } catch (e) { return ""; }
})();

/* その場限りのプレイヤーID(リロードしても同タブなら維持) */
const pid = (() => {
  try {
    let v = sessionStorage.getItem("ito_pid");
    if (!v) {
      v = "p" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem("ito_pid", v);
    }
    return v;
  } catch (e) {
    return "p" + Math.random().toString(36).slice(2);
  }
})();

const EMPTY_ROOM = {
  phase: "lobby",       // lobby | select(お題一覧) | playing | result
  result: null,          // clear | fail
  theme: "",
  themeBy: "",           // 候補から決まったお題の提案者名
  themeVia: "",          // roulette | pick | ""(手入力)
  roulette: null,        // 一覧画面で回転中のルーレット {id, items:[{pid,name,text}], pick, at}
  round: 0,
  hostId: "",
  anonymous: false,      // 匿名モード(プレイ中は名前を隠し、結果で公開)
  players: {},           // {pid: {name, joined, num, played, failed, word, proposal}}
  order: [],             // 作戦ボード: 予想順(小さい順)のpid配列
  board: []              // [{pid, name, num, failed}] 出された順
};

async function txRoom(fn) {
  if (!db) return;
  try {
    await db.runTransaction(async (t) => {
      const snap = await t.get(roomRef);
      const data = snap.exists ? snap.data() : JSON.parse(JSON.stringify(EMPTY_ROOM));
      const next = fn(data);
      if (next) {
        next.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        t.set(roomRef, next);
      }
    });
  } catch (e) {
    console.error(e);
    alert("通信に失敗しました。もう一度お試しください。");
  }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sortedPlayers(players) {
  return Object.entries(players || {})
    .map(([id, p]) => ({id, ...p}))
    .sort((a, b) => (a.joined || 0) - (b.joined || 0));
}

/* お題候補(入力済みのプレイヤー) */
function candidates(players) {
  return sortedPlayers(players).filter((p) => (p.proposal || "").trim());
}

/* ラウンドの状態を片付ける(ロビー/一覧画面へ戻るとき) */
function clearRound(d) {
  d.result = null; d.board = []; d.theme = ""; d.order = [];
  d.themeBy = ""; d.themeVia = ""; d.roulette = null;
  Object.values(d.players || {}).forEach((p) => {
    p.num = null; p.played = false; p.failed = false; p.word = "";
  });
}

/* 数字を配ってラウンド開始(手入力・ルーレット共通) */
function dealInto(d, theme) {
  const ids = Object.keys(d.players || {});
  if (ids.length < 2) { alert("2人以上で開始できます"); return false; }
  const pool = shuffle(Array.from({length: 100}, (_, i) => i + 1));
  ids.forEach((id, i) => {
    const p = d.players[id];
    p.num = pool[i]; p.played = false; p.failed = false; p.word = "";
  });
  d.theme = theme;
  d.order = sortedPlayers(d.players).map((p) => p.id);
  d.phase = "playing";
  d.result = null;
  d.board = [];
  d.round = (d.round || 0) + 1;
  return true;
}

/* テスト用プレイヤーが自動で出すお題候補 */
const BOT_THEMES = ["好きな食べ物", "行ってみたい国", "強そうな動物", "人気のコンビニ商品",
  "怖いもの", "もらってうれしいプレゼント", "便利な道具", "かっこいい名前"];
function botTheme(except) {
  const ex = [].concat(except || []);
  let c = BOT_THEMES.filter((t) => ex.indexOf(t) < 0);
  if (!c.length) c = BOT_THEMES;
  return c[Math.floor(Math.random() * c.length)];
}
function usedProposals(d) {
  return Object.values(d.players || {}).map((p) => p.proposal).filter(Boolean);
}
/* 採用された候補を片付ける(ボットは次の候補を自動で用意) */
function consumeProposal(d, id) {
  const p = d.players && d.players[id];
  if (!p) return;
  p.proposal = p.bot ? botTheme(usedProposals(d)) : "";
}

/* カードを出す(actor=出す人のpid / botOnly=テスト用プレイヤーの代理のみ許可) */
function playCardAs(actor, botOnly) {
  return txRoom((d) => {
    if (d.phase !== "playing") return null;
    const me = d.players && d.players[actor];
    if (!me || me.played || me.num == null) return null;
    if (botOnly && !me.bot) return null;
    const skipped = Object.entries(d.players)
      .filter(([id, p]) => id !== actor && !p.played && p.num != null && p.num < me.num)
      .sort((a, b) => a[1].num - b[1].num);
    skipped.forEach(([id, p]) => {
      p.played = true; p.failed = true;
      d.board.push({pid: id, name: p.name, num: p.num, failed: true});
    });
    me.played = true;
    d.board.push({pid: actor, name: me.name, num: me.num, failed: false});
    const allDone = Object.values(d.players).every((p) => p.num == null || p.played);
    if (allDone) {
      d.phase = "result";
      d.result = d.board.some((c) => c.failed) ? "miss" : "clear";
    }
    return d;
  });
}

function listCandidates(d) {
  return sortedPlayers(d.players)
    .filter((p) => (p.proposal || "").trim())
    .map((p) => ({pid: p.id, name: p.name, text: p.proposal.trim()}));
}

/* 一覧画面: ホストが候補を選んで決定 → ゲーム画面へ */
function pickDealTx(targetPid) {
  return txRoom((d) => {
    if (d.phase !== "select" || d.roulette) return null;   // ルーレット回転中は不可
    const it = listCandidates(d).find((x) => x.pid === targetPid);
    if (!it) { alert("その候補は取り消されたようです"); return null; }
    if (!dealInto(d, it.text)) return null;
    consumeProposal(d, it.pid);
    d.themeBy = it.name; d.themeVia = "pick";
    return d;
  });
}

/* 一覧画面: ルーレット開始(結果はここで決定し、演出は各端末の一覧画面で再生) */
function startRouletteTx() {
  return txRoom((d) => {
    if (d.phase !== "select" || d.roulette) return null;
    const items = listCandidates(d);
    if (!items.length) { alert("お題候補がまだありません"); return null; }
    if (Object.keys(d.players || {}).length < 2) { alert("2人以上で開始できます"); return null; }
    d.roulette = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      items: items,
      pick: Math.floor(Math.random() * items.length),
      at: Date.now()
    };
    return d;
  });
}

/* ルーレット演出が終わったら配ってゲーム画面へ(何度呼ばれても1回だけ反映) */
function finishRouletteTx(rid) {
  return txRoom((d) => {
    const r = d.roulette;
    if (d.phase !== "select" || !r || r.id !== rid) return null;
    const it = r.items[r.pick];
    d.roulette = null;
    if (!dealInto(d, it.text)) return d;
    consumeProposal(d, it.pid);
    d.themeBy = it.name; d.themeVia = "roulette";
    return d;
  });
}

/* ============ 操作 ============ */
const actions = {
  join(name) {
    return txRoom((d) => {
      d.players = d.players || {};
      d.players[pid] = {name: name, joined: Date.now(), num: null, played: false, failed: false, word: "", proposal: ""};
      if (!d.hostId || !d.players[d.hostId]) d.hostId = pid;
      return d;
    });
  },
  leave() {
    return txRoom((d) => {
      if (!d.players || !d.players[pid]) return null;
      delete d.players[pid];
      const humans = sortedPlayers(d.players).filter((p) => !p.bot);
      if (!humans.length) return JSON.parse(JSON.stringify(EMPTY_ROOM)); // 人間がいなくなったら部屋を片付け
      if (d.hostId === pid) d.hostId = humans[0].id;
      return d;
    });
  },
  /* ---- テスト用プレイヤー(ボット) ---- */
  addBot() {
    return txRoom((d) => {
      if (d.phase === "playing") return null;
      d.players = d.players || {};
      const n = Object.values(d.players).filter((p) => p.bot).length + 1;
      const id = "bot" + Math.random().toString(36).slice(2, 8);
      d.players[id] = {name: "🤖テスト" + n, joined: Date.now(), num: null, played: false,
        failed: false, word: "", proposal: botTheme(usedProposals(d)), bot: true};
      return d;
    });
  },
  removeBots() {
    return txRoom((d) => {
      if (d.phase === "playing") return null;
      Object.keys(d.players || {}).forEach((id) => { if (d.players[id].bot) delete d.players[id]; });
      if (!d.players[d.hostId]) {
        const h = sortedPlayers(d.players)[0];
        d.hostId = h ? h.id : "";
      }
      return d;
    });
  },
  playBot(id) { return playCardAs(id, true); },
  becomeHost() {
    return txRoom((d) => { d.hostId = pid; return d; });
  },
  transferHost(id) {
    return txRoom((d) => {
      if (d.players && d.players[id]) d.hostId = id;
      return d;
    });
  },
  deal(theme) {
    return txRoom((d) => {
      if (!dealInto(d, theme)) return null;
      d.themeBy = ""; d.themeVia = ""; d.roulette = null;
      return d;
    });
  },
  /* 一覧画面: ルーレット開始 / 終了 */
  startRoulette() { return startRouletteTx(); },
  finishRoulette(rid) { return finishRouletteTx(rid); },
  /* 一覧画面: 候補からホストが任意に選んで決定 */
  pickDeal(id) { return pickDealTx(id); },
  setProposal(t) {
    if (!db) return;
    roomRef.update({["players." + pid + ".proposal"]: t}).catch(() => {});
  },
  playCard() { return playCardAs(pid, false); },
  /* 作戦ボード: id の人を to 番目へ移動(サーバー上の最新の並びに対して適用) */
  moveOrder(id, to) {
    return txRoom((d) => {
      if (d.phase !== "playing") return null;
      const cur = aliveOrder(d).map((p) => p.id);   // 重複なしの最新の並び
      const i = cur.indexOf(id);
      if (i < 0) return null;
      cur.splice(i, 1);
      cur.splice(Math.max(0, Math.min(to, cur.length)), 0, id);
      d.order = cur;
      return d;
    });
  },
  toLobby() {
    return txRoom((d) => { clearRound(d); d.phase = "lobby"; return d; });
  },
  /* ホスト: お題候補一覧画面へ(全員の画面が切り替わる) */
  openSelect() {
    return txRoom((d) => {
      if (d.phase === "playing") return null;
      clearRound(d);
      d.phase = "select";
      return d;
    });
  },
  resetAll() {
    return txRoom(() => JSON.parse(JSON.stringify(EMPTY_ROOM)));
  },
  /* ホスト: 匿名モードの切り替え(ラウンド中は変更不可) */
  setAnonymous(on) {
    return txRoom((d) => {
      if (d.phase === "playing") return null;
      d.anonymous = !!on;
      return d;
    });
  },
  setWord(w) {
    if (!db) return;
    roomRef.update({["players." + pid + ".word"]: w}).catch(() => {});
  }
};

    <div className="screen">

            <div className="label">あそびかた</div>

          </div>
        </div>
        <div className="panel big-form">

          <input type="text" maxLength={20} placeholder="例: あいことば"

          <p className="note" style={{margin: 0}}>
            アカウント登録は不要。その場限りの名前でOKです。<br />
            同じ合言葉を入れた人どうしが同じ部屋に入ります。

          </p>

}

function LeaveButton() {

    <button className="btn sm ghost" onClick={() => {

/* プレイ中・結果の上部バー(お題を大きく) */
function ThemeBar({room, roomId}) {
  const missCount = (room.board || []).filter((c) => c.failed).length;
  return (
    <div className="play-top">
      <div className="play-side">
        <RoomChips room={room} roomId={roomId} noAnon />
      </div>
      <div className="play-theme">
        <div className="label">お題</div>
        <div className="txt">{room.theme || "(お題なし)"}</div>
        {(room.themeBy || room.anonymous) && (
          <div className="by">
            {room.themeBy && (room.themeVia === "roulette" ? "🎰 ルーレットで決定" : "👉 ホストが選択")}
            {room.themeBy && !hideNames(room) ? " / " + room.themeBy + " さんの候補" : ""}
            {room.anonymous && <span className="anon-tag">🎭 匿名モード{room.phase === "result" ? "(名前を公開中)" : ""}</span>}
          </div>
        )}
      </div>
      <div className="play-side right">
        {missCount > 0 && <span className="round-chip miss">✕ ミス {missCount}</span>}
        <HowToLink />
      </div>
    </div>
  );
}

/* 自分のお題候補を登録(一覧はホストが一覧画面で全員に見せる) */
function ProposalPanel({room, title, compact}) {
  const [t, setT] = useState("");
  const me = room.players && room.players[pid];
  if (!me) return null;
  const count = candidates(room.players).length;
  const total = Object.keys(room.players || {}).length;
  const submit = () => {
    const v = t.trim();
    if (!v) return;
    actions.setProposal(v);
    setT("");
  };
  return (
    <div className={"panel" + (compact ? "" : " big-form")}>
      <div className="label">{title || "お題候補を登録(1人1つ)"}</div>
      <div className="row">
        <input type="text" maxLength={60} style={{flex: 1, minWidth: 0}}
          placeholder={me.proposal ? "書き直す…" : (compact ? "お題を出そう" : "お題を出そう(例: 好きな食べ物)")}
          value={t} onChange={(e) => setT(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
        <button className="btn" style={{flex: "0 0 auto"}} disabled={!t.trim()} onClick={submit}>
          {me.proposal ? "更新" : "登録"}
        </button>
      </div>
      {me.proposal && (
        <div className="prop-row me" style={{marginTop: 10}}>
          <div className="ptxt">
            {me.proposal}
            <div className="pby">あなたの候補</div>
          </div>
          <button className="btn sm ghost" onClick={() => actions.setProposal("")}>取消</button>
        </div>
      )}

/* ルーレット演出(全端末で同じ並び・同じ結果に止まる)
   終わったらホストが finishRoulette → 全員ゲーム画面へ。
   ホストが落ちた時の保険として、他の人も少し遅れて finishRoulette を呼ぶ(反映は1回だけ)。 */
function useRouletteSpin(roulette, isHost) {
  const [st, setSt] = useState(null);   // {step, done}
  const timers = useRef([]);
  const rid = roulette && roulette.id;
  useEffect(() => {
    if (!rid || !roulette.items || !roulette.items.length) { setSt(null); return; }
    const push = (fn, t) => timers.current.push(setTimeout(fn, t));
    const n = roulette.items.length;
    const loops = Math.max(2, Math.ceil(24 / n));
    const total = loops * n + roulette.pick;
    let seen = "";
    try { seen = sessionStorage.getItem("ito_rl_seen") || ""; } catch (e) {}
    try { sessionStorage.setItem("ito_rl_seen", rid); } catch (e) {}
    const late = seen === rid || Math.abs(Date.now() - (roulette.at || 0)) > 15000;
    if (late) {                                  // リロード・途中参加: 結果だけ表示
      setSt({step: total, done: true});
      push(() => actions.finishRoulette(rid), isHost ? 800 : 3500);
    } else {
      setSt({step: 0, done: false});
      let t = 0;
      for (let s = 1; s <= total; s++) {
        const r = s / total;
        t += 50 + 420 * r * r * r;               // だんだん減速
        push(() => setSt({step: s, done: s === total}), t);
      }
      push(() => actions.finishRoulette(rid), t + (isHost ? 2000 : 5000));  // 「決定!」を見せてからゲームへ
    }
    return () => { timers.current.forEach(clearTimeout); timers.current = []; };
  }, [rid]);
  return st;
}

/* 作戦ボードの並び(まだ出していない人) */
function aliveOrder(room) {
  const alive = [], seen = {};
  const add = (id) => {
    if (seen[id]) return;                      // 同じ人を2回並べない
    const p = room.players && room.players[id];
    if (p && p.num != null && !p.played) { seen[id] = true; alive.push({id: id, ...p}); }
  };
  (room.order || []).forEach(add);
  Object.keys(room.players || {}).forEach(add);
  return alive;
}

/* 中央: みんなの名前とたとえワード(作戦ボード兼用) */
function WordBoard({room}) {
  const watchers = sortedPlayers(room.players).filter((p) => p.num == null);
  const [drag, setDrag] = useState(null);      // {id, from, to, startY, dy, rects, shift}
  const [pending, setPending] = useState(null); // 保存待ちの並び(サーバー反映までのチラつき防止)
  const listRef = useRef(null);
  const seq = useRef(0);
  const orderKey = JSON.stringify(room.order || []);
  useEffect(() => { setPending(null); }, [orderKey]);

  const byIds = (arr, ids) => {
    const pos = (id) => { const k = ids.indexOf(id); return k < 0 ? 999 : k; };
    return arr.slice().sort((a, b) => pos(a.id) - pos(b.id));
  };
  let list = aliveOrder(room);
  if (pending) list = byIds(list, pending);
  if (drag) list = byIds(list, drag.ids);    // ドラッグ中は他の人の並べ替えが届いても並びを固定

  /* ドラッグ中に誰かがカードを出した(メンバーが変わった)らドラッグを取り消す */
  const memberKey = list.map((p) => p.id).sort().join(",");
  useEffect(() => { if (drag && drag.memberKey !== memberKey) setDrag(null); }, [memberKey]);

  /* ---- ドラッグ&ドロップ(マウスは行のどこでも / タッチは左のつまみ) ---- */
  function onDown(e, id, idx) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (e.target.closest("button")) return;
    if (e.pointerType !== "mouse" && !e.target.closest(".grip")) return;
    const rows = Array.from(listRef.current.querySelectorAll(".mrow"));
    const rects = rows.map((r) => r.getBoundingClientRect());
    const gap = rects.length > 1 ? rects[1].top - rects[0].bottom : 8;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
    setDrag({id: id, from: idx, to: idx, startY: e.clientY, dy: 0, rects: rects, shift: rects[idx].height + gap,
      ids: list.map((p) => p.id), memberKey: memberKey});
  }
  function onMove(e) {
    if (!drag) return;
    const dy = e.clientY - drag.startY;
    const r = drag.rects[drag.from];
    const cy = r.top + r.height / 2 + dy;
    let to = 0;
    drag.rects.forEach((rr, i) => { if (i !== drag.from && cy > rr.top + rr.height / 2) to++; });
    setDrag({...drag, dy: dy, to: to});
  }
  function onUp() {
    if (!drag) return;
    const {from, to, id} = drag;
    setDrag(null);
    if (from === to) return;
    const ids = drag.ids.filter((x) => x !== id);   // 番号ではなく「人」で取り除く
    ids.splice(to, 0, id);
    setPending(ids);
    const my = ++seq.current;
    Promise.resolve(actions.moveOrder(id, to)).then(() => {
      setTimeout(() => { if (seq.current === my) setPending(null); }, 1500);
    });
  }
  /* ドラッグ中の見た目上の位置 */
  function visualIndex(i) {
    if (!drag) return i;
    const {from, to} = drag;
    if (i === from) return to;
    if (from < to && i > from && i <= to) return i - 1;
    if (from > to && i >= to && i < from) return i + 1;
    return i;
  }
  function rowStyle(i) {
    if (!drag) return undefined;
    if (i === drag.from) return {transform: "translateY(" + drag.dy + "px)"};
    const v = visualIndex(i);
    return v === i ? undefined : {transform: "translateY(" + ((v - i) * drag.shift) + "px)"};
  }

  return (
    <div className="panel pcol-panel">
      <div className="label">みんなのたとえワード(作戦ボード:小さいと思う順)</div>
      <div className="pscroll" ref={listRef}>
        {list.length === 0 && <div className="cardrow-empty">全員出し終わりました</div>}
        {list.map((p, i) => (
          <div key={p.id} style={rowStyle(i)}
            className={"mrow" + (p.id === pid ? " me" : "") + (drag ? (drag.from === i ? " dragging" : " shifting") : "")}
            onPointerDown={(e) => onDown(e, p.id, i)}
            onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}>
            <span className="grip" title="ドラッグで並べ替え">⠿</span>
            <span className="rank">{visualIndex(i) + 1}</span>
            <div className="mbody">
              <div className="mname">
                {hideNames(room)
                  ? (p.id === pid ? <span className="you-mark">あなた</span> : (p.bot ? "🤖" : null))
                  : p.name}
                {!hideNames(room) && p.id === room.hostId && <span className="host-mark">HOST</span>}
                {p.bot && <span className="st bot">#{p.num}</span>}
              </div>
              <div className={"mword" + (p.word ? "" : " empty")}>{p.word || "(考え中…)"}</div>
            </div>
            {p.bot && (
              <div className="mbtns">
                <button className="btn sm pink" onClick={() => actions.playBot(p.id)}>代わりに出す</button>
              </div>
            )}
          </div>
        ))}
      </div>
      <p className="note" style={{margin: "8px 0 0"}}>
        ドラッグ&ドロップで並べ替え(誰でもOK・全員に同期)。出した人は右へ移動します。
        {watchers.length > 0 && <React.Fragment><br />見学: {watchers.map((p) => p.name).join("、")}</React.Fragment>}
      </p>
    </div>
  );
}

        📋 お題一覧をみる({candCount}件)
      </button>
      <AnonToggle room={room} />
      <div className="row wrap">
        <button className="btn sm ghost" onClick={actions.toLobby}>メインメニューへ</button>
        <LeaveButton />
      </div>
    </div>
  );
}

/* 結果画面: 結果と次の操作 | 答え合わせ(小さい順) | 出した順 */
function ResultScreen({room, roomId, isHost}) {
  const board = room.board || [];
  const miss = board.filter((c) => c.failed).length;
  const perfect = miss === 0;
  const answer = board.slice().sort((a, b) => a.num - b.num);
  const wordOf = (c) => { const p = room.players && room.players[c.pid]; return (p && p.word) || ""; };
  const candCount = candidates(room.players).length;
  return (
    <div className="screen">
      <ThemeBar room={room} roomId={roomId} />
      <div className="grid3">
        <div className="pcol">
          <div className={"panel result " + (perfect ? "clear" : "fail")}>
            <div className="big-txt">{perfect ? "パーフェクト!🎉" : "クリア!"}</div>
            <div className="desc">
              {perfect ? "全員のカードを順番どおりに出し切りました!" : "ミス " + miss + " 回。次はパーフェクトを狙おう!"}
            </div>
          </div>
          <ProposalPanel room={room} title="次のお題候補を登録" compact />
          {isHost ? <NextRoundHost room={room} candCount={candCount} /> : (
            <div className="panel pc-ctrl">
              <span className="note">ホストが次のお題を準備中…</span>
              <HostRecovery room={room} />
              <LeaveButton />
            </div>
          )}
        </div>

        <div className="panel pcol-panel">
          <div className="label">答え合わせ(小さい順)</div>
          <div className="pscroll">
            {answer.map((c) => (
              <div key={c.pid + "-" + c.num} className={"arow" + (c.failed ? " ng" : "")}>
                <span className="anum">{c.num}</span>
                <div className="mbody">
                  <div className="mname">{c.failed ? "✕ " : ""}{c.name}</div>
                  <div className={"mword" + (wordOf(c) ? "" : " empty")}>{wordOf(c) || "(たとえワードなし)"}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="panel pcol-panel">
          <div className="label">出した順</div>
          <div className="pscroll">
            {board.map((c, i) => (
              <div key={c.pid + "-" + c.num} className={"trow" + (c.failed ? " ng" : "")}>
                <span className="ti">{i + 1}</span>
                <span className="tn">{c.name}</span>
                <span className="sp" />
                <span className="tv">{c.failed ? "✕ " : ""}{c.num}</span>
              </div>
            ))}
          </div>
          <p className="note" style={{margin: "8px 0 0"}}>✕ は自分より大きい数字が先に出てしまったカードです。</p>
        </div>
      </div>
    </div>
  );
}

/* ============ ルーム画面 ============ */
function Room({room, roomId}) {
  const isHost = room.hostId === pid;
  const ph = room.phase;
  return (
    <div>
      {ph === "playing" ? <PlayScreen room={room} roomId={roomId} isHost={isHost} />
        : ph === "result" ? <ResultScreen room={room} roomId={roomId} isHost={isHost} />
        : ph === "select" ? <SelectScreen room={room} roomId={roomId} isHost={isHost} />
        : <LobbyScreen room={room} roomId={roomId} isHost={isHost} />}
    </div>
  );
}

/* ============ ルート ============ */
function App() {
  const [roomId, setRoomId] = useState(initialRoom);
  const [room, setRoom] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!CONFIG_OK) { setLoading(false); return; }
    if (!roomId) { setRoom(null); setLoading(false); return; }
    roomRef = db.collection("ito").doc(roomId);
    try { sessionStorage.setItem("ito_room", roomId); } catch (e) {}
    try { history.replaceState(null, "", "#" + encodeURIComponent(roomId)); } catch (e) {}
    setLoading(true);
    const unsub = roomRef.onSnapshot((snap) => {
      setRoom(snap.exists ? snap.data() : JSON.parse(JSON.stringify(EMPTY_ROOM)));
      setLoading(false);
    }, (err) => { console.error(err); setLoading(false); });
    return unsub;
  }, [roomId]);

  if (!CONFIG_OK) return <ConfigError />;
  if (loading) return <CenterScreen><div className="panel"><p className="note" style={{margin: 0}}>接続中…</p></div></CenterScreen>;

  const joined = roomId && room && room.players && room.players[pid];
  if (!joined) {
    return <JoinScreen defaultRoom={roomId}
      onJoin={(name, rid) => {
        roomRef = db.collection("ito").doc(rid);
        actions.join(name);
        setRoomId(rid);
      }} />;
  }
  return <Room room={room} roomId={roomId} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
